name: Schedule Check — Auto Resume

on:
  schedule:
    # Run every 2 hours between 9 PM and 8 AM UTC (covers overnight in most timezones)
    - cron: '0 21,23,1,3,5,7 * * *'

  # Also allow manual trigger
  workflow_dispatch:

jobs:
  check-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if generation is in progress
        id: check
        run: |
          if [ -f "state/state.json" ]; then
            STATUS=$(python3 -c "import json; s=json.load(open('state/state.json')); print(s.get('status','idle'))")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "Current status: $STATUS"
          else
            echo "status=idle" >> $GITHUB_OUTPUT
            echo "No state file found."
          fi

      - name: Resume generation if paused
        if: steps.check.outputs.status == 'paused' || steps.check.outputs.status == 'running'
        run: |
          echo "Status is '${{ steps.check.outputs.status }}' — triggering resume run..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate.yml/dispatches" \
            -d '{"ref":"main","inputs":{"session_type":"resume"}}'
          echo "✅ Resume workflow triggered."

      - name: Skip if already done or idle
        if: steps.check.outputs.status == 'done' || steps.check.outputs.status == 'idle'
        run: echo "Status is '${{ steps.check.outputs.status }}' — nothing to do."
